; Capas sobre BaseScalability.ini del motor: solo las claves que cambian en calidad Epic (@3).
; Estas cvars viven en grupos de escalabilidad, por eso no sirve ponerlas en [SystemSettings] de DefaultEngine.ini
; (la escalabilidad se aplica despues y las pisaria).

[TextureQuality@3]
; Filtrado anisotropico maximo: texturas del suelo nitidas a distancia y en angulo rasante (la rejilla del 1v1)
r.MaxAnisotropy=16

[ShadowQuality@3]
; Mas resolucion de sombra virtual para las luces locales: los focos del lobby dibujan sombras definidas en el personaje
r.Shadow.Virtual.ResolutionLodBiasLocal=-0.5
